version: 2

sources:
  - name: jsb_platform
    database: jsb_platform
    schema: jsb_platform
    tables:
      - name: players
      - name: player_vip_tier_history
      - name: player_tag_history
      - name: wallets
      - name: wallet_transactions
      - name: deposit_attempts
      - name: withdrawal_requests
      - name: bets
      - name: sports_bet_details
      - name: casino_round_details
      - name: retail_bet_details
      - name: bonus_campaigns
      - name: player_bonuses
      - name: bonus_rollover_events
      # player_identity is intentionally NOT a source here: PII stays in the
      # operational database only and is never pulled into the analytical layer.

  - name: jsb_assessment
    database: jsb_assessment
    schema: jsb_assessment
    tables:
      - name: internal_deposits
      - name: gateway_settlement
      - name: transactions
      - name: ingest_runs

models:
  - name: stg_players
    description: One row per player, current attributes only (history is in stg_player_vip_tier_history).
    columns:
      - name: player_id
        tests: [unique, not_null]
  - name: stg_player_vip_tier_history
    columns:
      - name: player_id
        tests: [not_null]
  - name: stg_wallet_transactions
    description: "The ledger, typed and renamed. Grain: one row per wallet movement."
    columns:
      - name: wallet_txn_id
        tests: [unique, not_null]
      - name: idempotency_key
        tests: [unique, not_null]
  - name: stg_bets
    columns:
      - name: bet_id
        tests: [unique, not_null]
      - name: player_id
        tests: [not_null]
  - name: stg_deposit_attempts
    columns:
      - name: deposit_attempt_id
        tests: [unique, not_null]
  - name: stg_player_bonuses
    columns:
      - name: player_bonus_id
        tests: [unique, not_null]
  - name: stg_internal_deposits
    description: "Exercise 1 source, typed and reference-normalised for matching."
    columns:
      - name: deposit_id
        tests: [unique, not_null]
  - name: stg_gateway_settlement
    description: "Exercise 1 source. No natural unique key (the source itself contains duplicate settlement rows -- that's one of the exception categories), so row_id is a dbt-generated surrogate."
    columns:
      - name: row_id
        tests: [unique, not_null]
  - name: stg_transactions
    description: "Exercise 2's ingested transactions table, staged for consistency with the other two exercises."
    columns:
      - name: id
        tests: [unique, not_null]
  - name: stg_ingest_runs
    description: "Exercise 2's run log: one row per ingestion run."
    columns:
      - name: run_id
        tests: [unique, not_null]
