version: 2

models:
  - name: dim_player
    columns:
      - name: player_id
        tests: [unique, not_null]
  - name: dim_player_vip_tier_scd
    description: Type 2 dimension; one row per tier period per player.
  - name: dim_campaign
    columns:
      - name: campaign_id
        tests: [unique, not_null]
  - name: dim_date
    columns:
      - name: date_day
        tests: [unique, not_null]
  - name: fact_bet
    description: One row per accepted wager, any product.
    columns:
      - name: bet_id
        tests: [unique, not_null]
      - name: player_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_player')
              field: player_id
  - name: fact_wallet_transaction
    description: One row per wallet ledger movement. The reconciliation spine.
    columns:
      - name: wallet_txn_id
        tests: [unique, not_null]
      - name: idempotency_key
        tests: [unique, not_null]
  - name: fact_bonus_transaction
    columns:
      - name: player_bonus_id
        tests: [unique, not_null]
  - name: mart_ngr_by_product_monthly
    description: Answers example_queries.sql query (a) as a reusable dbt model.
  - name: mart_bonus_cost_pct_of_ngr
    description: Answers example_queries.sql query (b) as a reusable dbt model.
  - name: fct_recon_exceptions
    description: "Exercise 1's reconciliation categorisation, as a dbt model (see exercise1-reconciliation/sql/03_reconciliation.sql for the equivalent standalone SQL)."
    columns:
      - name: deposit_id
        description: Null for gateway-only rows (no matching internal record).
      - name: settlement_row_id
        description: Null for internal-only rows (no gateway settlement found/yet).
      - name: category
        tests:
          - accepted_values:
              values:
                - "OK: matched, amount and fee correct"
                - "BREAK: payment confirmed, wallet not credited"
                - "BREAK: unrecognised settlement (no internal record)"
                - "BREAK: duplicate internal SUCCESS deposit for one settlement (double-credit risk)"
                - "BREAK: duplicate gateway settlement for one reference (double-credit risk)"
                - "BREAK: deposit SUCCESS, no gateway settlement found"
                - "BREAK: settled fee differs from contracted fee"
                - "BREAK: settled gross amount differs from internal amount"
                - "NOT A PROBLEM: rounding difference <= 1 cent"
                - "REVERSAL: gateway reversed/charged back after settlement"
                - "TIMING: settlement expected in next period (created near cut-off)"
  - name: mart_recon_summary_by_category
    description: "The daily close-pack: exception count and impact total per category."
